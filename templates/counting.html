{% extends "base.html" %}

{% block content %}
<h2>Inventory Counting</h2>

<div class="card mb-3">
    <div class="card-body">
        <div class="row">
            <div class="col-md-3">
                <label>Select Warehouse</label>
                <select id="warehouse" class="form-control">
                    <option value="All">-- All Warehouses --</option>
                    <option value="Main">Main Warehouse</option>
                    <option value="5thFloor">5th Floor Warehouse</option>
                </select>
                <small class="text-muted">Filters SKUs by warehouse</small>
            </div>
            <div class="col-md-3">
                <label>Day Category</label>
                <select id="dayCategory" class="form-control">
                    <option value="All">-- All Day Categories --</option>
                </select>
            </div>
            <div class="col-md-3">
                <label>Item Category</label>
                <select id="itemCategory" class="form-control">
                    <option value="All">-- All Item Categories --</option>
                </select>
            </div>
            <div class="col-md-3">
                <label>Search SKU</label>
                <div style="position: relative;">
                    <input type="text" id="searchSku" class="form-control" placeholder="Type to search... (e.g., Visor, Door, Armrest)">
                    <div id="suggestions" style="position: absolute; top: 100%; left: 0; right: 0; background: white; border: 1px solid #ccc; border-top: none; z-index: 1000; max-height: 200px; overflow-y: auto; display: none;"></div>
                </div>
                <small class="text-muted">Smart search - type to see suggestions</small>
            </div>
        </div>
        <div class="row mt-2">
            <div class="col-md-12">
                <button id="applyFilters" class="btn btn-primary" onclick="applyFilters()">Apply Filters</button>
                <button id="saveCounts" class="btn btn-success" onclick="saveAllCounts()">Save All Counts</button>
                <button id="completeCounting" class="btn btn-danger" onclick="completeCounting()">Complete Counting Session</button>
            </div>
        </div>
    </div>
</div>

<div id="loadingIndicator" style="display: none; text-align: center; padding: 20px;">
    <div class="spinner-border text-primary" role="status">
        <span class="visually-hidden">Loading...</span>
    </div>
    <p>Loading SKUs...</p>
</div>

<div id="skusList" class="row">
    <div class="col-12">
        <div class="alert alert-info text-center">
            Select filters and click "Apply Filters" to load SKUs
        </div>
    </div>
</div>

<div id="paginationControls" class="row mt-3" style="display: none;">
    <div class="col-12 text-center">
        <button class="btn btn-secondary" onclick="previousPage()">Previous</button>
        <span id="pageInfo" class="mx-3">Page 1</span>
        <button class="btn btn-secondary" onclick="nextPage()">Next</button>
    </div>
</div>

<script>
// Day Category order mapping (ONLY ADDITION - doesn't affect existing logic)
const DAY_ORDER = {
    'Mon': 1,
    'Tue': 2,
    'Wed': 3,
    'Thu': 4,
    'Fri': 5,
    'Sat': 6
};

// Define which Item Categories belong to 5th Floor Warehouse (EXISTING LOGIC - unchanged)
const FIFTH_FLOOR_CATEGORIES = [
    'Console/Armrest',
    'Deep Dish-3D',
    'Deep Dish-5D',
    'Deep Dish-5D-CF',
    'Deep Dish-DL',
    'Deep Dish-DM',
    'Deep Dish-ROHS',
    'Deep Dish-TPE-CF',
    'Deep Dish-UN',
    'Trunk Tray'
];

// Store all data from server (EXISTING LOGIC - unchanged)
let allItemCategories = {{ item_categories|tojson }};
let allDayCategoriesRaw = {{ day_categories|tojson }};
let allSkus = [];
let filteredSkus = [];
let currentPage = 1;
let itemsPerPage = 50;
let currentSessionId = null;
let searchTimeout = null; // NEW: for smart search debouncing

// Sort day categories in Mon, Tue, Wed, Thu, Fri, Sat order (NEW FEATURE)
let allDayCategories = [...allDayCategoriesRaw].sort((a, b) => {
    let orderA = DAY_ORDER[a] || 999;
    let orderB = DAY_ORDER[b] || 999;
    return orderA - orderB;
});

// Function to filter item categories based on warehouse selection (EXISTING LOGIC - unchanged)
function filterItemCategoriesByWarehouse() {
    let warehouse = document.getElementById('warehouse').value;
    let itemCategorySelect = document.getElementById('itemCategory');
    let currentValue = itemCategorySelect.value;
    
    // Clear existing options
    itemCategorySelect.innerHTML = '<option value="All">-- All Item Categories --</option>';
    
    let filteredCategories = [];
    
    if (warehouse === '5thFloor') {
        // Only show 5th Floor categories
        filteredCategories = allItemCategories.filter(cat => FIFTH_FLOOR_CATEGORIES.includes(cat));
    } else if (warehouse === 'Main') {
        // Show Main Warehouse categories (all except 5th Floor)
        filteredCategories = allItemCategories.filter(cat => !FIFTH_FLOOR_CATEGORIES.includes(cat));
    } else {
        // Show all categories for "All Warehouses"
        filteredCategories = [...allItemCategories];
    }
    
    // Sort alphabetically
    filteredCategories.sort();
    
    // Add filtered categories to dropdown
    for (let i = 0; i < filteredCategories.length; i++) {
        let option = document.createElement('option');
        option.value = filteredCategories[i];
        option.textContent = filteredCategories[i];
        itemCategorySelect.appendChild(option);
    }
    
    // Try to restore previous selection if still valid
    if (currentValue !== 'All' && filteredCategories.includes(currentValue)) {
        itemCategorySelect.value = currentValue;
    }
    
    // Also update day categories based on selected item category
    updateDayCategories();
}

// Function to update day categories based on selected item category (UPDATED with sorting)
function updateDayCategories() {
    let selectedItemCategory = document.getElementById('itemCategory').value;
    let dayCategorySelect = document.getElementById('dayCategory');
    let currentValue = dayCategorySelect.value;
    
    // Clear existing options
    dayCategorySelect.innerHTML = '<option value="All">-- All Day Categories --</option>';
    
    let filteredDayCategories = [];
    
    if (selectedItemCategory !== 'All' && allSkus.length > 0) {
        // Get unique day categories for the selected item category
        let daySet = new Set();
        for (let i = 0; i < allSkus.length; i++) {
            if (allSkus[i].description === selectedItemCategory && allSkus[i].category) {
                daySet.add(allSkus[i].category);
            }
        }
        filteredDayCategories = Array.from(daySet);
    } else {
        // Show all day categories
        filteredDayCategories = [...allDayCategories];
    }
    
    // Sort day categories in Mon, Tue, Wed, Thu, Fri, Sat order (NEW SORTING LOGIC)
    filteredDayCategories.sort((a, b) => {
        let orderA = DAY_ORDER[a] || 999;
        let orderB = DAY_ORDER[b] || 999;
        return orderA - orderB;
    });
    
    // Add filtered day categories to dropdown
    for (let i = 0; i < filteredDayCategories.length; i++) {
        if (filteredDayCategories[i]) {
            let option = document.createElement('option');
            option.value = filteredDayCategories[i];
            option.textContent = filteredDayCategories[i];
            dayCategorySelect.appendChild(option);
        }
    }
    
    // Try to restore previous selection if still valid
    if (currentValue !== 'All' && filteredDayCategories.includes(currentValue)) {
        dayCategorySelect.value = currentValue;
    }
}

// NEW FUNCTION: Smart search with suggestions (DOES NOT affect existing logic)
function setupSmartSearch() {
    let searchInput = document.getElementById('searchSku');
    let suggestionsDiv = document.getElementById('suggestions');
    
    searchInput.addEventListener('input', function() {
        let term = this.value.trim();
        
        if (term.length < 2) {
            suggestionsDiv.style.display = 'none';
            return;
        }
        
        // Clear previous timeout
        if (searchTimeout) clearTimeout(searchTimeout);
        
        // Debounce search to avoid performance issues
        searchTimeout = setTimeout(function() {
            // Get unique SKU suggestions
            let suggestions = [];
            let seen = new Set();
            
            for (let i = 0; i < allSkus.length && suggestions.length < 15; i++) {
                let sku = allSkus[i];
                // Search in SKU only (faster, more relevant)
                if (sku.sku.toLowerCase().includes(term.toLowerCase())) {
                    if (!seen.has(sku.sku)) {
                        seen.add(sku.sku);
                        suggestions.push({
                            sku: sku.sku,
                            description: sku.description,
                            id: sku.id
                        });
                    }
                }
            }
            
            if (suggestions.length > 0) {
                suggestionsDiv.innerHTML = '';
                for (let i = 0; i < suggestions.length; i++) {
                    let item = suggestions[i];
                    let div = document.createElement('div');
                    div.className = 'suggestion-item';
                    div.style.padding = '8px 12px';
                    div.style.cursor = 'pointer';
                    div.style.borderBottom = '1px solid #eee';
                    div.innerHTML = `<strong>${escapeHtml(item.sku)}</strong> <small class="text-muted">${escapeHtml(item.description || '')}</small>`;
                    div.onclick = (function(skuValue) {
                        return function() {
                            searchInput.value = skuValue;
                            suggestionsDiv.style.display = 'none';
                            applyFilters();
                        };
                    })(item.sku);
                    suggestionsDiv.appendChild(div);
                }
                suggestionsDiv.style.display = 'block';
            } else {
                suggestionsDiv.style.display = 'none';
            }
        }, 300);
    });
    
    // Hide suggestions when clicking outside
    document.addEventListener('click', function(e) {
        if (e.target !== searchInput && !suggestionsDiv.contains(e.target)) {
            suggestionsDiv.style.display = 'none';
        }
    });
}

// EXISTING FUNCTION - unchanged
function applyFilters() {
    let warehouse = document.getElementById('warehouse').value;
    let dayCategory = document.getElementById('dayCategory').value;
    let itemCategory = document.getElementById('itemCategory').value;
    let search = document.getElementById('searchSku').value;
    
    loadSkus(warehouse, dayCategory, itemCategory, search);
}

// EXISTING FUNCTION - unchanged
function loadSkus(warehouse, dayCategory, itemCategory, search) {
    let loadingDiv = document.getElementById('loadingIndicator');
    let skusListDiv = document.getElementById('skusList');
    
    loadingDiv.style.display = 'block';
    skusListDiv.innerHTML = '<div class="col-12"><div class="alert alert-info text-center">Loading SKUs...</div></div>';
    
    let url = '/get_skus?day_category=' + encodeURIComponent(dayCategory) + 
              '&item_category=' + encodeURIComponent(itemCategory) + 
              '&search=' + encodeURIComponent(search);
    
    console.log('Fetching:', url);
    
    fetch(url)
        .then(response => response.json())
        .then(data => {
            console.log('Received:', data.length, 'SKUs from server');
            
            // Store all SKUs for smart search
            allSkus = data;
            
            // Apply warehouse filter on client side
            let warehouseFiltered = [];
            for (let i = 0; i < data.length; i++) {
                let sku = data[i];
                let belongsTo5thFloor = FIFTH_FLOOR_CATEGORIES.includes(sku.description);
                
                if (warehouse === '5thFloor' && belongsTo5thFloor) {
                    warehouseFiltered.push(sku);
                } else if (warehouse === 'Main' && !belongsTo5thFloor) {
                    warehouseFiltered.push(sku);
                } else if (warehouse === 'All') {
                    warehouseFiltered.push(sku);
                }
            }
            
            console.log('After warehouse filter:', warehouseFiltered.length, 'SKUs');
            
            filteredSkus = warehouseFiltered;
            currentPage = 1;
            displaySkusWithPagination();
            loadingDiv.style.display = 'none';
            
            // Update day categories based on selected item category
            updateDayCategories();
        })
        .catch(error => {
            console.error('Error:', error);
            skusListDiv.innerHTML = '<div class="col-12"><div class="alert alert-danger text-center">Error loading SKUs: ' + error + '</div></div>';
            loadingDiv.style.display = 'none';
        });
}

// EXISTING FUNCTION - unchanged
function displaySkusWithPagination() {
    let startIndex = (currentPage - 1) * itemsPerPage;
    let endIndex = startIndex + itemsPerPage;
    let pageSkus = filteredSkus.slice(startIndex, endIndex);
    
    displaySkus(pageSkus);
    
    let paginationDiv = document.getElementById('paginationControls');
    if (filteredSkus.length > itemsPerPage) {
        paginationDiv.style.display = 'block';
        let totalPages = Math.ceil(filteredSkus.length / itemsPerPage);
        document.getElementById('pageInfo').textContent = 'Page ' + currentPage + ' of ' + totalPages + ' (' + filteredSkus.length + ' total SKUs)';
    } else {
        paginationDiv.style.display = 'none';
    }
}

// EXISTING FUNCTION - unchanged
function displaySkus(skus) {
    let skusListDiv = document.getElementById('skusList');
    
    if (!skus || skus.length === 0) {
        skusListDiv.innerHTML = '<div class="col-12"><div class="alert alert-warning text-center">No SKUs found. Try different filters.</div></div>';
        return;
    }
    
    let html = '<div class="col-12"><div class="table-responsive"><table class="table table-bordered table-hover table-striped">';
    html += '<thead class="table-dark">';
    html += '<tr>';
    html += '<th>SKU</th>';
    html += '<th>Description (Item Category)</th>';
    html += '<th>Day Category</th>';
    html += '<th>Last Count</th>';
    html += '<th>Container Qty</th>';
    html += '<th>Container Details</th>';
    html += '<th>Final Expected</th>';
    html += '<th>Kenneth\'s Inv</th>';
    html += '<th>Initial Count</th>';
    html += '<th>Status</th>';
    html += '</tr>';
    html += '</thead><tbody>';
    
    for (let i = 0; i < skus.length; i++) {
        let sku = skus[i];
        let statusBadge = '';
        if (sku.bypass_recount) {
            statusBadge = '<span class="badge bg-warning">Bypass</span>';
        }
        
        let containerDetails = sku.container_details || '-';
        if (containerDetails.length > 50) {
            containerDetails = containerDetails.substring(0, 50) + '...';
        }
        
        html += '<tr id="sku-row-' + sku.id + '">';
        html += '<td><strong>' + escapeHtml(sku.sku) + '</strong></td>';
        html += '<td>' + escapeHtml(sku.description || '-') + '</td>';
        html += '<td>' + escapeHtml(sku.category || '-') + '</td>';
        html += '<td class="fw-bold">' + (sku.last_count || 0) + '</td>';
        html += '<td>' + (sku.total_container_qty || 0) + '</td>';
        html += '<td><small>' + escapeHtml(containerDetails) + '</small></td>';
        html += '<td class="fw-bold text-primary">' + (sku.final_expected_count || 0) + '</td>';
        html += '<td class="fw-bold text-success">' + (sku.kenneth_inventory || 0) + '</td>';
        html += '<td><input type="number" class="form-control initial-count" data-sku-id="' + sku.id + '" value="0" step="0.01" style="min-width: 100px; width: 100px;"></td>';
        html += '<td>' + statusBadge + '</td>';
        html += '</tr>';
    }
    
    html += '</tbody></table></div></div>';
    skusListDiv.innerHTML = html;
}

// EXISTING FUNCTION - unchanged
function previousPage() {
    if (currentPage > 1) {
        currentPage--;
        displaySkusWithPagination();
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }
}

// EXISTING FUNCTION - unchanged
function nextPage() {
    let totalPages = Math.ceil(filteredSkus.length / itemsPerPage);
    if (currentPage < totalPages) {
        currentPage++;
        displaySkusWithPagination();
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }
}

// EXISTING FUNCTION - unchanged
function escapeHtml(text) {
    if (!text) return '';
    return text.replace(/[&<>]/g, function(m) {
        if (m === '&') return '&amp;';
        if (m === '<') return '&lt;';
        if (m === '>') return '&gt;';
        return m;
    });
}

// EXISTING FUNCTION - unchanged
function saveAllCounts() {
    let warehouse = document.getElementById('warehouse').value;
    let warehouseDisplay = warehouse === '5thFloor' ? '5th Floor Warehouse' : (warehouse === 'Main' ? 'Main Warehouse' : 'All Warehouses');
    let counts = {};
    
    let countInputs = document.querySelectorAll('.initial-count');
    for (let i = 0; i < countInputs.length; i++) {
        let input = countInputs[i];
        let skuId = input.getAttribute('data-sku-id');
        let count = input.value;
        if (parseFloat(count) !== 0) {
            counts[skuId] = {initial_count: count};
        }
    }
    
    let totalCounted = Object.keys(counts).length;
    
    if (!confirm('Save counts for ' + totalCounted + ' SKUs to ' + warehouseDisplay + '?')) {
        return;
    }
    
    let saveBtn = document.getElementById('saveCounts');
    saveBtn.disabled = true;
    saveBtn.textContent = 'Saving...';
    
    fetch('/counting', {
        method: 'POST',
        headers: {
            'Content-Type': 'application/json',
        },
        body: JSON.stringify({
            session_id: currentSessionId,
            warehouse: warehouseDisplay,
            counts: counts
        })
    })
    .then(response => response.json())
    .then(data => {
        if (data.success) {
            currentSessionId = data.session_id;
            alert('Counts saved successfully!');
            checkForRecounts();
        } else {
            alert('Error saving counts');
        }
    })
    .catch(error => {
        alert('Error: ' + error);
    })
    .finally(() => {
        saveBtn.disabled = false;
        saveBtn.textContent = 'Save All Counts';
    });
}

// EXISTING FUNCTION - unchanged
function checkForRecounts() {
    if (!currentSessionId) return;
    
    fetch('/get_recount_list?session_id=' + currentSessionId)
        .then(response => response.json())
        .then(data => {
            if (data.length > 0) {
                showRecountModal(data);
            } else {
                alert('No items need recount. You can complete the counting session.');
            }
        });
}

// EXISTING FUNCTION - unchanged
function showRecountModal(recountItems) {
    let html = '<div class="table-responsive"><table class="table table-bordered">';
    html += '<thead><tr>';
    html += '<th>SKU</th>';
    html += '<th>Initial Count</th>';
    html += '<th>Final Expected</th>';
    html += '<th>Kenneth\'s Inv</th>';
    html += '<th>Recount Count</th>';
    html += '<th>Remarks</th>';
    html += '</tr></thead><tbody>';
    
    for (let i = 0; i < recountItems.length; i++) {
        let item = recountItems[i];
        html += '<tr>';
        html += '<td>' + escapeHtml(item.sku) + '</td>';
        html += '<td class="bg-warning">' + item.initial_count + '</td>';
        html += '<td class="bg-info">' + (item.final_expected_count || 0) + '</td>';
        html += '<td class="bg-info">' + (item.kenneth_inventory || 0) + '</td>';
        html += '<td><input type="number" class="form-control recount-count" data-record-id="' + item.id + '" step="0.01"></td>';
        html += '<td><textarea class="form-control recount-remarks" data-record-id="' + item.id + '" rows="2" placeholder="Reason for discrepancy"></textarea></td>';
        html += '</tr>';
    }
    
    html += '</tbody></table></div>';
    html += '<button class="btn btn-primary mt-3" onclick="saveRecounts()">Save Recounts</button>';
    
    let modalHtml = `
        <div class="modal fade" id="recountModal" tabindex="-1">
            <div class="modal-dialog modal-lg">
                <div class="modal-content">
                    <div class="modal-header">
                        <h5 class="modal-title">Recount Required Items</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                    </div>
                    <div class="modal-body">
                        ${html}
                    </div>
                </div>
            </div>
        </div>
    `;
    
    let existingModal = document.getElementById('recountModal');
    if (existingModal) {
        existingModal.remove();
    }
    
    document.body.insertAdjacentHTML('beforeend', modalHtml);
    
    let modal = new bootstrap.Modal(document.getElementById('recountModal'));
    modal.show();
}

// EXISTING FUNCTION - unchanged
function saveRecounts() {
    let recounts = [];
    let countInputs = document.querySelectorAll('.recount-count');
    
    for (let i = 0; i < countInputs.length; i++) {
        let input = countInputs[i];
        let recordId = input.getAttribute('data-record-id');
        let recountCount = input.value;
        let remarks = document.querySelector('.recount-remarks[data-record-id="' + recordId + '"]').value;
        
        if (recountCount && parseFloat(recountCount) !== 0) {
            recounts.push({
                record_id: recordId,
                recount_count: recountCount,
                remarks: remarks || ''
            });
        }
    }
    
    if (recounts.length === 0) {
        alert('No recount counts entered');
        return;
    }
    
    fetch('/save_recount', {
        method: 'POST',
        headers: {
            'Content-Type': 'application/json',
        },
        body: JSON.stringify({recounts: recounts})
    })
    .then(response => response.json())
    .then(data => {
        if (data.success) {
            alert('Recounts saved!');
            location.reload();
        }
    });
}

// EXISTING FUNCTION - unchanged
function completeCounting() {
    if (!currentSessionId) {
        alert('Please save counts first');
        return;
    }
    
    if (confirm('Complete this counting session?')) {
        fetch('/complete_counting', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
            },
            body: JSON.stringify({session_id: currentSessionId})
        })
        .then(response => response.json())
        .then(data => {
            if (data.success) {
                alert('Session completed!');
                window.location.href = '/dashboard';
            }
        });
    }
}

// Event listeners (EXISTING LOGIC - unchanged)
document.getElementById('warehouse').addEventListener('change', function() {
    filterItemCategoriesByWarehouse();
    applyFilters();
});

document.getElementById('itemCategory').addEventListener('change', function() {
    updateDayCategories();
    applyFilters();
});

// Auto-load on page load (UPDATED to include smart search setup)
document.addEventListener('DOMContentLoaded', function() {
    console.log('Page loaded, setting up...');
    filterItemCategoriesByWarehouse();
    setupSmartSearch(); // NEW: Initialize smart search
    applyFilters();
});
</script>

<style>
.suggestion-item:hover {
    background-color: #f0f0f0;
}
</style>
{% endblock %}
