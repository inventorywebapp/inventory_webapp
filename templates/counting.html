{% extends "base.html" %}

{% block content %}
<h2>Inventory Counting</h2>

<div class="card mb-3">
    <div class="card-body">
        <div class="row g-2">
            <div class="col-md-3 col-6">
                <label>Warehouse</label>
                <select id="warehouse" class="form-select form-select-sm">
                    <option value="All">-- All --</option>
                    <option value="Main">Main Warehouse</option>
                    <option value="5thFloor">5th Floor</option>
                </select>
            </div>
            <div class="col-md-3 col-6">
                <label>Day Category</label>
                <select id="dayCategory" class="form-select form-select-sm">
                    <option value="All">-- All --</option>
                </select>
            </div>
            <div class="col-md-3 col-6">
                <label>Item Category</label>
                <select id="itemCategory" class="form-select form-select-sm">
                    <option value="All">-- All --</option>
                </select>
            </div>
            <div class="col-md-3 col-6">
                <label>Search</label>
                <input type="text" id="searchSku" class="form-control form-control-sm" placeholder="SKU or Description">
            </div>
        </div>
        <div class="row mt-2">
            <div class="col-12 d-flex gap-2 flex-wrap">
                <button id="applyFilters" class="btn btn-primary btn-sm" onclick="applyFilters()">Apply Filters</button>
                <button id="saveCounts" class="btn btn-success btn-sm" onclick="saveAllCounts()">Save All</button>
                <button id="scanBarcodeBtn" class="btn btn-info btn-sm" onclick="startBarcodeScanner()">
                    <i class="bi bi-upc-scan"></i> Scan
                </button>
                <button id="completeCounting" class="btn btn-danger btn-sm" onclick="completeCounting()">Complete</button>
            </div>
        </div>
    </div>
</div>

<!-- Swipe Indicator for Mobile -->
<div id="swipeIndicator" class="text-center mb-2 d-md-none" style="display: none;">
    <small class="text-muted">
        <i class="bi bi-arrow-left-right"></i> Swipe left/right to see all columns
    </small>
    <div class="progress mt-1" style="height: 2px; width: 100px; margin: 0 auto;">
        <div class="progress-bar" style="width: 30%;"></div>
    </div>
</div>

<!-- Loading Indicator -->
<div id="loadingIndicator" style="display: none; text-align: center; padding: 20px;">
    <div class="spinner-border text-primary" role="status">
        <span class="visually-hidden">Loading...</span>
    </div>
    <p>Loading SKUs...</p>
</div>

<!-- SKU Table - Mobile Optimized -->
<div id="skusList" class="row">
    <div class="col-12">
        <div class="alert alert-info text-center">
            Select filters and click "Apply Filters" to load SKUs
        </div>
    </div>
</div>

<!-- Pagination -->
<div id="paginationControls" class="row mt-3" style="display: none;">
    <div class="col-12 text-center">
        <button class="btn btn-secondary btn-sm" onclick="previousPage()">◀ Previous</button>
        <span id="pageInfo" class="mx-2">Page 1</span>
        <button class="btn btn-secondary btn-sm" onclick="nextPage()">Next ▶</button>
    </div>
</div>

<!-- Scanner Modal -->
<div class="modal fade" id="scannerModal" tabindex="-1" data-bs-backdrop="static">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-header bg-primary text-white">
                <h5 class="modal-title"><i class="bi bi-upc-scan"></i> Scan Barcode/QR</h5>
                <button type="button" class="btn-close btn-close-white" onclick="stopBarcodeScanner()"></button>
            </div>
            <div class="modal-body p-0">
                <div id="qr-reader" style="width: 100%; min-height: 400px;"></div>
                <div id="qr-reader-results" class="p-2"></div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" onclick="stopBarcodeScanner()">Close</button>
                <button class="btn btn-primary" onclick="manualBarcodeEntry()">Manual Entry</button>
            </div>
        </div>
    </div>
</div>

<!-- Recount Modal -->
<div class="modal fade" id="recountModal" tabindex="-1" data-bs-backdrop="static">
    <div class="modal-dialog modal-xl">
        <div class="modal-content">
            <div class="modal-header bg-warning">
                <h5 class="modal-title">⚠️ Recount Required</h5>
                <button type="button" class="btn-close" onclick="closeRecountModal()"></button>
            </div>
            <div class="modal-body" id="recountModalBody"></div>
            <div class="modal-footer">
                <button class="btn btn-secondary" onclick="closeRecountModal()">Close</button>
                <button class="btn btn-success" onclick="saveRecounts()">Save Recounts</button>
            </div>
        </div>
    </div>
</div>

<style>
/* Mobile Optimizations */
@media (max-width: 768px) {
    .table-responsive {
        overflow-x: auto;
        -webkit-overflow-scrolling: touch;
        scroll-behavior: smooth;
    }
    
    /* Sticky first two columns on mobile */
    .table thead th:first-child,
    .table tbody td:first-child {
        position: sticky;
        left: 0;
        background-color: #343a40;
        z-index: 10;
    }
    
    .table thead th:first-child {
        background-color: #343a40;
        color: white;
    }
    
    .table tbody td:first-child {
        background-color: white;
        box-shadow: 2px 0 5px -2px rgba(0,0,0,0.1);
    }
    
    .table thead th:nth-child(2),
    .table tbody td:nth-child(2) {
        position: sticky;
        left: 120px;
        background-color: #343a40;
        z-index: 9;
    }
    
    .table thead th:nth-child(2) {
        background-color: #343a40;
        color: white;
    }
    
    .table tbody td:nth-child(2) {
        background-color: white;
        box-shadow: 2px 0 5px -2px rgba(0,0,0,0.1);
    }
    
    /* Larger touch targets for inputs */
    .initial-count {
        min-height: 44px;
        font-size: 16px !important;
    }
    
    /* Highlight active row */
    .table tbody tr:active {
        background-color: #e7f1ff !important;
    }
    
    /* Better badge sizing */
    .badge {
        font-size: 10px;
        padding: 4px 8px;
        white-space: nowrap;
    }
    
    /* Smaller text for mobile */
    .table td, .table th {
        font-size: 12px;
        padding: 8px 6px;
    }
}

/* Desktop optimizations */
@media (min-width: 769px) {
    .table-responsive {
        overflow-x: auto;
    }
    
    .initial-count {
        min-width: 100px;
    }
}

/* Common styles */
.sku-completed {
    background-color: #d1e7dd !important;
    border-left: 3px solid #198754;
}
.sku-in-progress {
    background-color: #cfe2ff !important;
    border-left: 3px solid #0d6efd;
}
.sku-needs-count {
    background-color: #fff3cd !important;
    border-left: 3px solid #ffc107;
}
.sku-typing {
    background-color: #ffe69e !important;
    border-left: 3px solid #ffc107;
}
.initial-count:focus {
    outline: none;
    box-shadow: 0 0 0 2px #0d6efd;
    background-color: #fff;
}
.fw-bold.text-dark {
    font-weight: 600 !important;
}
</style>

<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

<script>
// ============================================
// CONFIGURATION
// ============================================
const DAY_ORDER = {'Mon': 1, 'Tue': 2, 'Wed': 3, 'Thu': 4, 'Fri': 5, 'Sat': 6};
const FIFTH_FLOOR_CATEGORIES = [
    'Console/Armrest', 'Deep Dish-3D', 'Deep Dish-5D', 'Deep Dish-5D-CF',
    'Deep Dish-DL', 'Deep Dish-DM', 'Deep Dish-ROHS', 'Deep Dish-TPE-CF',
    'Deep Dish-UN', 'Trunk Tray'
];

const COUNT_EXPIRATION_DAYS = 14;

let allSkus = [];
let filteredSkus = [];
let currentPage = 1;
let itemsPerPage = 50;
let currentSessionId = null;
let html5QrCode = null;
let isScannerActive = false;
let recountItems = [];

let allItemCategories = {{ item_categories|tojson }};
let allDayCategoriesRaw = {{ day_categories|tojson }};
let allDayCategories = [...allDayCategoriesRaw].sort((a,b) => (DAY_ORDER[a] || 999) - (DAY_ORDER[b] || 999));

// ============================================
// HELPER FUNCTIONS
// ============================================
function getUrlParameter(name) {
    let params = new URLSearchParams(window.location.search);
    return params.get(name);
}

function escapeHtml(text) {
    if (!text) return '';
    return text.replace(/[&<>]/g, function(m) {
        if (m === '&') return '&amp;';
        if (m === '<') return '&lt;';
        if (m === '>') return '&gt;';
        return m;
    });
}

function showToast(message, type) {
    let toast = document.createElement('div');
    toast.className = `alert alert-${type} position-fixed bottom-0 end-0 m-3`;
    toast.style.zIndex = 9999;
    toast.style.minWidth = '250px';
    toast.innerHTML = message;
    document.body.appendChild(toast);
    setTimeout(() => toast.remove(), 3000);
}

// ============================================
// FILTER FUNCTIONS
// ============================================
function filterItemCategoriesByWarehouse() {
    let warehouse = document.getElementById('warehouse').value;
    let itemSelect = document.getElementById('itemCategory');
    let currentVal = itemSelect.value;
    
    itemSelect.innerHTML = '<option value="All">-- All --</option>';
    let filtered = warehouse === '5thFloor' ? allItemCategories.filter(c => FIFTH_FLOOR_CATEGORIES.includes(c)) :
                    warehouse === 'Main' ? allItemCategories.filter(c => !FIFTH_FLOOR_CATEGORIES.includes(c)) :
                    [...allItemCategories];
    filtered.sort();
    filtered.forEach(cat => {
        let opt = document.createElement('option');
        opt.value = cat;
        opt.textContent = cat;
        itemSelect.appendChild(opt);
    });
    if (filtered.includes(currentVal)) itemSelect.value = currentVal;
    updateDayCategories();
}

function updateDayCategories() {
    let selectedItem = document.getElementById('itemCategory').value;
    let daySelect = document.getElementById('dayCategory');
    let currentVal = daySelect.value;
    
    daySelect.innerHTML = '<option value="All">-- All --</option>';
    let filteredDays = selectedItem !== 'All' && allSkus.length > 0 ?
        [...new Set(allSkus.filter(s => s.description === selectedItem && s.category).map(s => s.category))] :
        [...allDayCategories];
    filteredDays.sort((a,b) => (DAY_ORDER[a] || 999) - (DAY_ORDER[b] || 999));
    filteredDays.forEach(day => {
        if (day) {
            let opt = document.createElement('option');
            opt.value = day;
            opt.textContent = day;
            daySelect.appendChild(opt);
        }
    });
    if (filteredDays.includes(currentVal)) daySelect.value = currentVal;
}

// ============================================
// LOAD SKUS
// ============================================
function applyFilters() {
    let warehouse = document.getElementById('warehouse').value;
    let dayCat = document.getElementById('dayCategory').value;
    let itemCat = document.getElementById('itemCategory').value;
    let search = document.getElementById('searchSku').value;
    loadSkus(warehouse, dayCat, itemCat, search);
}

function loadSkus(warehouse, dayCategory, itemCategory, search) {
    document.getElementById('loadingIndicator').style.display = 'block';
    document.getElementById('skusList').innerHTML = '<div class="col-12"><div class="alert alert-info text-center">Loading SKUs...</div></div>';
    
    let url = `/get_skus?day_category=${encodeURIComponent(dayCategory)}&item_category=${encodeURIComponent(itemCategory)}&search=${encodeURIComponent(search)}`;
    
    fetch(url)
        .then(res => res.json())
        .then(data => {
            allSkus = data;
            filteredSkus = allSkus.filter(sku => {
                let is5thFloor = FIFTH_FLOOR_CATEGORIES.includes(sku.description);
                if (warehouse === '5thFloor') return is5thFloor;
                if (warehouse === 'Main') return !is5thFloor;
                return true;
            });
            
            document.getElementById('loadingIndicator').style.display = 'none';
            
            if (filteredSkus.length === 0) {
                document.getElementById('skusList').innerHTML = '<div class="col-12"><div class="alert alert-warning text-center">No SKUs found. Try different filters.</div></div>';
                document.getElementById('paginationControls').style.display = 'none';
                return;
            }
            
            // Show swipe indicator on mobile
            let swipeIndicator = document.getElementById('swipeIndicator');
            if (swipeIndicator && window.innerWidth < 768 && filteredSkus.length > 0) {
                swipeIndicator.style.display = 'block';
                setTimeout(() => {
                    if (swipeIndicator) swipeIndicator.style.display = 'none';
                }, 5000);
            }
            
            currentPage = 1;
            displaySkusWithPagination();
            if (currentSessionId) loadExistingCountsForSkus();
            updateDayCategories();
        })
        .catch(err => {
            console.error(err);
            document.getElementById('loadingIndicator').style.display = 'none';
            document.getElementById('skusList').innerHTML = '<div class="col-12"><div class="alert alert-danger text-center">Error loading SKUs</div></div>';
        });
}

function loadExistingCountsForSkus() {
    let skuIds = filteredSkus.map(s => s.id).join(',');
    if (!skuIds || !currentSessionId) return;
    
    fetch(`/get_latest_counts?sku_ids=${skuIds}&session_id=${currentSessionId}`)
        .then(res => res.json())
        .then(data => {
            for (let [skuId, countData] of Object.entries(data)) {
                let input = document.querySelector(`.initial-count[data-sku-id="${skuId}"]`);
                let lastCountedSpan = document.getElementById(`last-counted-${skuId}`);
                if (input) input.value = countData.initial_count;
                if (lastCountedSpan) lastCountedSpan.innerHTML = countData.count_time;
            }
            highlightSkusStatus();
        })
        .catch(err => console.error(err));
}

// ============================================
// DISPLAY TABLE
// ============================================
function displaySkusWithPagination() {
    let start = (currentPage - 1) * itemsPerPage;
    let end = start + itemsPerPage;
    let pageSkus = filteredSkus.slice(start, end);
    displaySkus(pageSkus);
    
    let totalPages = Math.ceil(filteredSkus.length / itemsPerPage);
    let paginationDiv = document.getElementById('paginationControls');
    if (filteredSkus.length > itemsPerPage) {
        paginationDiv.style.display = 'block';
        document.getElementById('pageInfo').textContent = `Page ${currentPage} of ${totalPages} (${filteredSkus.length} total)`;
    } else {
        paginationDiv.style.display = 'none';
    }
}

function displaySkus(skus) {
    if (!skus || skus.length === 0) {
        document.getElementById('skusList').innerHTML = '<div class="col-12"><div class="alert alert-warning text-center">No SKUs found</div></div>';
        return;
    }
    
    let html = `<div class="col-12"><div class="table-responsive">
        <table class="table table-bordered table-hover table-striped">
            <thead class="table-dark">
                <tr>
                    <th>SKU</th>
                    <th>Description</th>
                    <th>Day<br>Cat</th>
                    <th>Last<br>Date</th>
                    <th>Last<br>Count</th>
                    <th>Container<br>Qty</th>
                    <th>Container Details</th>
                    <th>Final<br>Expected</th>
                    <th>Kenneth's<br>Inv</th>
                    <th>Current Count</th>
                    <th>Last Counted Date</th>
                    <th>Prev<br>Count</th>
                    <th>Status</th>
                </tr>
            </thead>
            <tbody>`;
    
    for (let sku of skus) {
        let isCompleted = sku.has_count && sku.is_completed && !sku.is_expired;
        let isInProgress = sku.in_progress || (sku.has_count && !sku.is_completed);
        let isExpired = sku.is_expired;
        let hasCount = sku.has_count && !isExpired;
        
        let rowClass = '';
        let statusBadge = '';
        
        if (isExpired) {
            rowClass = 'sku-needs-count';
            statusBadge = '<span class="badge bg-warning">Expired</span>';
        } else if (isCompleted) {
            rowClass = 'sku-completed';
            statusBadge = '<span class="badge bg-success">Completed</span>';
        } else if (isInProgress) {
            rowClass = 'sku-in-progress';
            statusBadge = '<span class="badge bg-primary">In Progress</span>';
        } else {
            rowClass = 'sku-needs-count';
            statusBadge = '<span class="badge bg-warning">Needs Count</span>';
        }
        
        if (sku.bypass_recount) statusBadge = '<span class="badge bg-secondary">Bypass</span>';
        
        let containerDetails = sku.container_details || '-';
        if (containerDetails.length > 30) containerDetails = containerDetails.substring(0, 30) + '...';
        
        html += `<tr id="sku-row-${sku.id}" class="${rowClass}" data-sku-id="${sku.id}">
            <td><strong>${escapeHtml(sku.sku)}</strong></td>
            <td>${escapeHtml(sku.description || '-')}</td>
            <td>${escapeHtml(sku.category || '-')}</td>
            <td>${escapeHtml(sku.last_count_date?.split(' ')[0] || '-')}</td>
            <td class="fw-bold">${sku.last_count || 0}</td>
            <td>${sku.total_container_qty || 0}</td>
            <td><small>${escapeHtml(containerDetails)}</small></td>
            <td class="fw-bold text-dark">${sku.final_expected_count || 0}</td>
            <td class="fw-bold text-dark">${sku.kenneth_inventory || 0}</td>
            <td><input type="text" class="form-control initial-count" data-sku-id="${sku.id}" style="min-width:90px" placeholder="Enter count" inputmode="numeric" value="${hasCount && sku.final_count ? sku.final_count : ''}"></td>
            <td><span id="last-counted-${sku.id}">${hasCount && sku.count_time ? sku.count_time : '-'}</span></td>
            <td><span id="prev-count-${sku.id}">${hasCount && sku.final_count ? sku.final_count : '-'}</span></td>
            <td>${statusBadge}</td>
        </tr>`;
    }
    
    html += `</tbody></table></div></div>`;
    document.getElementById('skusList').innerHTML = html;
    
    // Bind input events
    setTimeout(() => {
        document.querySelectorAll('.initial-count').forEach(input => {
            input.addEventListener('input', () => highlightSkusStatus());
            input.addEventListener('blur', function() {
                let val = this.value;
                if (val && (isNaN(val) || val.includes('.') || parseFloat(val) < 0)) {
                    alert('Please enter a valid whole number');
                    this.value = '';
                }
            });
            input.addEventListener('keypress', (e) => {
                if (!/[\d]/.test(e.key) && e.key !== 'Backspace' && e.key !== 'Delete' && e.key !== 'Tab' && e.key !== 'Enter') {
                    e.preventDefault();
                }
            });
        });
        highlightSkusStatus();
    }, 50);
}

function highlightSkusStatus() {
    let counted = 0;
    document.querySelectorAll('.initial-count').forEach(input => {
        let row = input.closest('tr');
        if (!row) return;
        let val = input.value;
        if (val && val !== '') {
            counted++;
            row.classList.add('sku-typing');
            row.classList.remove('sku-needs-count', 'sku-in-progress', 'sku-completed');
        } else {
            row.classList.remove('sku-typing');
            let hasCount = row.querySelector('#prev-count-') && row.querySelector('#prev-count-').innerHTML !== '-';
            if (hasCount) row.classList.add('sku-in-progress');
            else row.classList.add('sku-needs-count');
            row.classList.remove('sku-completed');
        }
    });
    
    // Update badges in title
    let title = document.querySelector('h2');
    if (!title) return;
    document.querySelectorAll('#completedBadge, #inProgressBadge, #uncountedBadge').forEach(b => b.remove());
    
    let total = document.querySelectorAll('.initial-count').length;
    let completed = document.querySelectorAll('.sku-completed').length;
    let inProgress = document.querySelectorAll('.sku-in-progress').length;
    let needCount = total - completed - inProgress;
    
    if (completed > 0) title.insertAdjacentHTML('beforeend', `<span id="completedBadge" class="badge bg-success ms-2">${completed} Done</span>`);
    if (inProgress > 0) title.insertAdjacentHTML('beforeend', `<span id="inProgressBadge" class="badge bg-primary ms-2">${inProgress} In Progress</span>`);
    if (needCount > 0) title.insertAdjacentHTML('beforeend', `<span id="uncountedBadge" class="badge bg-warning ms-2">${needCount} Need Count</span>`);
}

// ============================================
// PAGINATION
// ============================================
function previousPage() {
    if (currentPage > 1) {
        currentPage--;
        displaySkusWithPagination();
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }
}

function nextPage() {
    let totalPages = Math.ceil(filteredSkus.length / itemsPerPage);
    if (currentPage < totalPages) {
        currentPage++;
        displaySkusWithPagination();
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }
}

// ============================================
// SAVE COUNTS
// ============================================
function saveAllCounts() {
    let warehouse = document.getElementById('warehouse').value;
    let warehouseDisplay = warehouse === '5thFloor' ? '5th Floor Warehouse' : (warehouse === 'Main' ? 'Main Warehouse' : 'All Warehouses');
    
    let counts = {};
    let invalidSkus = [];
    
    document.querySelectorAll('.initial-count').forEach(input => {
        let skuId = input.getAttribute('data-sku-id');
        let val = input.value;
        if (val && val !== '') {
            if (isNaN(val) || val.includes('.') || parseFloat(val) < 0 || !Number.isInteger(parseFloat(val))) {
                let row = input.closest('tr');
                invalidSkus.push(row?.cells[0]?.innerText || 'Unknown');
            } else {
                counts[skuId] = { initial_count: parseInt(val) };
            }
        }
    });
    
    if (invalidSkus.length > 0) {
        alert(`Invalid counts (decimals/negatives):\n${invalidSkus.join('\n')}\n\nPlease correct.`);
        return;
    }
    
    if (Object.keys(counts).length === 0) {
        alert('No counts entered');
        return;
    }
    
    let saveBtn = document.getElementById('saveCounts');
    saveBtn.disabled = true;
    saveBtn.innerHTML = 'Saving...';
    
    fetch('/counting', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ session_id: currentSessionId, warehouse: warehouseDisplay, counts: counts })
    })
    .then(res => res.json())
    .then(data => {
        if (data.success) {
            currentSessionId = data.session_id;
            if (data.recount_needed_count > 0) {
                checkForRecounts();
            } else {
                alert(`✓ Saved ${Object.keys(counts).length} counts successfully!`);
                location.reload();
            }
        } else {
            alert('Error saving counts');
        }
    })
    .catch(err => alert('Error: ' + err))
    .finally(() => {
        saveBtn.disabled = false;
        saveBtn.innerHTML = 'Save All';
    });
}

function checkForRecounts() {
    fetch(`/get_recount_list?session_id=${currentSessionId}`)
        .then(res => res.json())
        .then(data => {
            if (data.length > 0) {
                recountItems = data;
                showRecountModal();
            } else {
                alert('All counts saved! Session completed.');
                window.location.href = '/dashboard';
            }
        });
}

function showRecountModal() {
    let html = '<div class="table-responsive"><table class="table table-bordered"><thead class="table-dark"><tr>';
    html += '<th>SKU</th><th>Description</th><th>Initial</th><th>Expected</th><th>Kenneth</th><th>Recount</th><th>Remarks</th></tr></thead><tbody>';
    
    recountItems.forEach(item => {
        html += `<tr>
            <td><strong>${escapeHtml(item.sku)}</strong></td>
            <td>${escapeHtml(item.description || '-')}</td>
            <td class="bg-warning">${item.initial_count}</td>
            <td class="bg-info">${item.final_expected_count || 0}</td>
            <td class="bg-info">${item.kenneth_inventory || 0}</td>
            <td><input type="text" class="form-control recount-count" data-record-id="${item.id}" inputmode="numeric" style="width:100px"></td>
            <td><textarea class="form-control recount-remarks" data-record-id="${item.id}" rows="1" style="width:150px"></textarea></td>
        </tr>`;
    });
    html += '</tbody></table></div>';
    document.getElementById('recountModalBody').innerHTML = html;
    new bootstrap.Modal(document.getElementById('recountModal')).show();
}

function closeRecountModal() {
    bootstrap.Modal.getInstance(document.getElementById('recountModal')).hide();
}

function saveRecounts() {
    let recounts = [];
    document.querySelectorAll('.recount-count').forEach(input => {
        let recordId = input.getAttribute('data-record-id');
        let remarks = document.querySelector(`.recount-remarks[data-record-id="${recordId}"]`)?.value || '';
        recounts.push({ record_id: recordId, recount_count: parseInt(input.value) || 0, remarks: remarks });
    });
    
    fetch('/save_recount', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ recounts: recounts })
    })
    .then(res => res.json())
    .then(data => {
        if (data.success) {
            closeRecountModal();
            alert('Recounts saved! Session completed.');
            window.location.href = '/dashboard';
        }
    });
}

function completeCounting() {
    if (!currentSessionId) {
        alert('Please save counts first');
        return;
    }
    fetch(`/check_recount_status?session_id=${currentSessionId}`)
        .then(res => res.json())
        .then(data => {
            if (data.has_pending_recounts) {
                alert(`You have ${data.count} pending recount(s). Complete them first.`);
            } else if (confirm('Complete counting session?')) {
                fetch('/complete_counting', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ session_id: currentSessionId })
                })
                .then(res => res.json())
                .then(data => {
                    if (data.success) {
                        alert('Session completed!');
                        window.location.href = '/dashboard';
                    }
                });
            }
        });
}

// ============================================
// BARCODE SCANNER
// ============================================
async function startBarcodeScanner() {
    if (isScannerActive) return;
    if (filteredSkus.length === 0) {
        alert('Please load SKUs first by applying filters');
        return;
    }
    
    new bootstrap.Modal(document.getElementById('scannerModal')).show();
    
    if (html5QrCode) {
        try { await html5QrCode.stop(); } catch(e) {}
        html5QrCode = null;
    }
    document.getElementById('qr-reader').innerHTML = '';
    
    html5QrCode = new Html5Qrcode("qr-reader");
    isScannerActive = true;
    
    try {
        await html5QrCode.start(
            { facingMode: "environment" },
            { fps: 15, qrbox: { width: 280, height: 280 } },
            (decodedText) => {
                stopBarcodeScanner();
                findSkuByBarcode(decodedText);
            },
            (errorMessage) => {}
        );
    } catch(err) {
        console.error(err);
        isScannerActive = false;
    }
}

function stopBarcodeScanner() {
    isScannerActive = false;
    if (html5QrCode) {
        html5QrCode.stop().catch(e => {});
        html5QrCode = null;
    }
    bootstrap.Modal.getInstance(document.getElementById('scannerModal'))?.hide();
    document.getElementById('qr-reader').innerHTML = '';
}

function manualBarcodeEntry() {
    let code = prompt('Enter barcode/QR code:');
    if (code) findSkuByBarcode(code);
}

function findSkuByBarcode(scannedText) {
    let searchTerm = scannedText.toLowerCase();
    let foundIndex = filteredSkus.findIndex(sku => 
        sku.sku.toLowerCase() === searchTerm || 
        sku.sku.toLowerCase().includes(searchTerm)
    );
    
    if (foundIndex !== -1) {
        let targetPage = Math.floor(foundIndex / itemsPerPage) + 1;
        if (targetPage !== currentPage) {
            currentPage = targetPage;
            displaySkusWithPagination();
            setTimeout(() => {
                let row = document.getElementById(`sku-row-${filteredSkus[foundIndex].id}`);
                if (row) {
                    row.scrollIntoView({ behavior: 'smooth', block: 'center' });
                    row.style.backgroundColor = '#90EE90';
                    setTimeout(() => { if (row) row.style.backgroundColor = ''; }, 3000);
                }
            }, 300);
        } else {
            let row = document.getElementById(`sku-row-${filteredSkus[foundIndex].id}`);
            if (row) {
                row.scrollIntoView({ behavior: 'smooth', block: 'center' });
                row.style.backgroundColor = '#90EE90';
                setTimeout(() => { if (row) row.style.backgroundColor = ''; }, 3000);
            }
        }
        showToast(`Found: ${filteredSkus[foundIndex].sku}`, 'success');
    } else {
        showToast(`SKU "${scannedText}" not found`, 'danger');
        document.getElementById('searchSku').value = scannedText;
        applyFilters();
    }
}

// ============================================
// INITIALIZATION
// ============================================
document.addEventListener('DOMContentLoaded', function() {
    filterItemCategoriesByWarehouse();
    
    document.getElementById('warehouse').addEventListener('change', () => { filterItemCategoriesByWarehouse(); applyFilters(); });
    document.getElementById('itemCategory').addEventListener('change', () => { updateDayCategories(); applyFilters(); });
    document.getElementById('searchSku').addEventListener('keypress', (e) => { if (e.key === 'Enter') applyFilters(); });
    
    let sessionId = getUrlParameter('session_id');
    if (sessionId) {
        currentSessionId = parseInt(sessionId);
        applyFilters();
    } else {
        fetch('/api/active_session').then(r => r.json()).then(data => {
            if (data.session_id) currentSessionId = data.session_id;
            applyFilters();
        }).catch(() => applyFilters());
    }
});
</script>
