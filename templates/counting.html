{% extends "base.html" %}

{% block content %}
<h2>Inventory Counting</h2>

<div class="card mb-3">
    <div class="card-body">
        <div class="row">
            <div class="col-md-3">
                <label>Select Warehouse (for tracking only)</label>
                <select id="warehouse" class="form-control">
                    <option value="Main Warehouse">Main Warehouse</option>
                    <option value="5th Floor Warehouse">5th Floor Warehouse</option>
                </select>
                <small class="text-muted">Warehouse selection does not filter SKUs</small>
            </div>
            <div class="col-md-3">
                <label>Day Category</label>
                <select id="dayCategory" class="form-control">
                    <option value="All">All</option>
                    {% for cat in day_categories %}
                    <option value="{{ cat }}">{{ cat }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="col-md-3">
                <label>Item Category</label>
                <select id="itemCategory" class="form-control">
                    <option value="All">All</option>
                    {% for cat in item_categories %}
                    <option value="{{ cat }}">{{ cat }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="col-md-3">
                <label>Search SKU</label>
                <input type="text" id="searchSku" class="form-control" placeholder="Type to search...">
                <div id="suggestions" class="list-group mt-1" style="position: absolute; z-index: 1000; width: auto; display: none;"></div>
            </div>
        </div>
        <div class="row mt-2">
            <div class="col-md-12">
                <button id="applyFilters" class="btn btn-primary">Apply Filters</button>
                <button id="saveCounts" class="btn btn-success">Save All Counts</button>
                <button id="completeCounting" class="btn btn-danger">Complete Counting Session</button>
            </div>
        </div>
    </div>
</div>

<div id="loadingIndicator" style="display: none; text-align: center; padding: 20px;">
    <div class="spinner-border text-primary" role="status">
        <span class="visually-hidden">Loading...</span>
    </div>
    <p>Loading SKUs...</p>
</div>

<div id="skusList" class="row">
    <div class="col-12">
        <div class="alert alert-info text-center">
            Click "Apply Filters" to load SKUs
        </div>
    </div>
</div>

<div id="recountModal" class="modal fade" tabindex="-1">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Recount Required Items</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <div id="recountItems"></div>
                <button id="saveRecount" class="btn btn-primary mt-3">Save Recounts</button>
            </div>
        </div>
    </div>
</div>

<script>
let currentSessionId = null;
let currentSkus = [];

$(document).ready(function() {
    console.log("Page loaded, initializing...");
    
    // Apply filters button
    $('#applyFilters').click(function() {
        loadSkus();
    });
    
    // Save counts button
    $('#saveCounts').click(function() {
        saveAllCounts();
    });
    
    // Complete counting button
    $('#completeCounting').click(function() {
        completeCounting();
    });
    
    // Search suggestions
    $('#searchSku').on('input', function() {
        let term = $(this).val();
        if (term.length >= 2) {
            $.get('/search_suggestions', {term: term}, function(data) {
                let suggestions = $('#suggestions');
                suggestions.empty();
                suggestions.show();
                data.forEach(function(item) {
                    suggestions.append(`
                        <a href="#" class="list-group-item list-group-item-action" data-sku-id="${item.id}" data-sku-code="${item.sku}">
                            ${item.sku} - ${item.description}
                        </a>
                    `);
                });
                $('.list-group-item-action').click(function(e) {
                    e.preventDefault();
                    let skuId = $(this).data('sku-id');
                    let skuCode = $(this).data('sku-code');
                    $('#searchSku').val(skuCode);
                    $('#suggestions').hide();
                    highlightSku(skuId);
                    loadSkus();
                });
            });
        } else {
            $('#suggestions').hide();
        }
    });
    
    // Hide suggestions when clicking outside
    $(document).click(function(e) {
        if (!$(e.target).closest('#searchSku').length) {
            $('#suggestions').hide();
        }
    });
    
    // Load SKUs on page load
    loadSkus();
});

function loadSkus() {
    let dayCategory = $('#dayCategory').val();
    let itemCategory = $('#itemCategory').val();
    let search = $('#searchSku').val();
    
    $('#loadingIndicator').show();
    $('#skusList').html('<div class="col-12"><div class="alert alert-info text-center">Loading SKUs...</div></div>');
    
    console.log("Loading SKUs with filters:", {dayCategory, itemCategory, search});
    
    $.get('/get_skus', {
        day_category: dayCategory,
        item_category: itemCategory,
        search: search
    }, function(data) {
        console.log("Received SKUs:", data.length);
        currentSkus = data;
        displaySkus(data);
        $('#loadingIndicator').hide();
    }).fail(function(xhr, status, error) {
        console.error("Error loading SKUs:", error);
        $('#loadingIndicator').hide();
        $('#skusList').html('<div class="col-12"><div class="alert alert-danger text-center">Error loading SKUs: ' + error + '</div></div>');
    });
}

function displaySkus(skus) {
    if (!skus || skus.length === 0) {
        $('#skusList').html('<div class="col-12"><div class="alert alert-warning text-center">No SKUs found. Try changing your filters.</div></div>');
        return;
    }
    
    let html = '<div class="col-12"><div class="table-responsive"><table class="table table-bordered table-hover table-striped">';
    html += '<thead class="table-dark">';
    html += '<tr>';
    html += '<th>SKU</th>';
    html += '<th>Description (Item Category)</th>';
    html += '<th>Day Category</th>';
    html += '<th>Last Count Date</th>';
    html += '<th>Last Count</th>';
    html += '<th>Container Qty</th>';
    html += '<th>Container Details</th>';
    html += '<th>Final Expected</th>';
    html += '<th>Kenneth\'s Inv</th>';
    html += '<th>Initial Count</th>';
    html += '<th>Status</th>';
    html += '</tr>';
    html += '</thead><tbody>';
    
    skus.forEach(function(sku) {
        let statusBadge = '';
        if (sku.bypass_recount) {
            statusBadge = '<span class="badge bg-warning">Bypass Recount</span>';
        } else if (sku.stock_status) {
            statusBadge = `<span class="badge bg-info">${sku.stock_status}</span>`;
        }
        
        // Truncate container details for better display
        let containerDetails = sku.container_details || '-';
        if (containerDetails.length > 50) {
            containerDetails = containerDetails.substring(0, 50) + '...';
        }
        
        html += `<tr id="sku-row-${sku.id}">`;
        html += `<td><strong>${sku.sku}</strong></td>`;
        html += `<td>${sku.description || '-'}</td>`;
        html += `<td>${sku.category || '-'}</td>`;
        html += `<td>${sku.last_count_date || '-'}</td>`;
        html += `<td class="fw-bold">${sku.last_count || 0}</td>`;
        html += `<td>${sku.total_container_qty || 0}</td>`;
        html += `<td><small>${containerDetails}</small></td>`;
        html += `<td class="fw-bold text-primary">${sku.final_expected_count || 0}</td>`;
        html += `<td class="fw-bold text-success">${sku.kenneth_inventory || 0}</td>`;
        html += `<td><input type="number" class="form-control initial-count" data-sku-id="${sku.id}" value="0" step="0.01" style="min-width: 100px;"></td>`;
        html += `<td>${statusBadge}</td>`;
        html += `</tr>`;
    });
    
    html += '</tbody></table></div></div>';
    $('#skusList').html(html);
}

function saveAllCounts() {
    let warehouse = $('#warehouse').val();
    let counts = {};
    
    $('.initial-count').each(function() {
        let skuId = $(this).data('sku-id');
        let count = $(this).val();
        counts[skuId] = {initial_count: count};
    });
    
    let totalCounted = Object.keys(counts).length;
    if (totalCounted === 0) {
        alert('No SKUs to save');
        return;
    }
    
    if (!confirm(`Save counts for ${totalCounted} SKUs to ${warehouse}?`)) {
        return;
    }
    
    $('#saveCounts').prop('disabled', true).text('Saving...');
    
    $.ajax({
        url: '/counting',
        method: 'POST',
        contentType: 'application/json',
        data: JSON.stringify({
            session_id: currentSessionId,
            warehouse: warehouse,
            counts: counts
        }),
        success: function(data) {
            if (data.success) {
                currentSessionId = data.session_id;
                alert('Counts saved successfully!');
                checkForRecounts();
            } else {
                alert('Error saving counts');
            }
        },
        error: function(xhr) {
            alert('Error saving counts: ' + xhr.statusText);
        },
        complete: function() {
            $('#saveCounts').prop('disabled', false).text('Save All Counts');
        }
    });
}

function checkForRecounts() {
    if (!currentSessionId) return;
    
    $.get('/get_recount_list', {session_id: currentSessionId}, function(data) {
        if (data.length > 0) {
            showRecountModal(data);
        } else {
            alert('No items need recount. You can complete the counting session.');
        }
    });
}

function showRecountModal(recountItems) {
    let html = '<div class="table-responsive"><table class="table table-bordered">';
    html += '<thead><tr>';
    html += '<th>SKU</th>';
    html += '<th>Description</th>';
    html += '<th>Initial Count</th>';
    html += '<th>Final Expected</th>';
    html += '<th>Kenneth\'s Inv</th>';
    html += '<th>Recount Count</th>';
    html += '<th>Remarks (e.g., 9 were damaged)</th>';
    html += '</tr></thead><tbody>';
    
    recountItems.forEach(function(item) {
        html += `<tr id="recount-row-${item.id}">`;
        html += `<td>${item.sku}</td>`;
        html += `<td>${item.description}</td>`;
        html += `<td class="bg-warning">${item.initial_count}</td>`;
        html += `<td class="bg-info">${item.final_expected_count || 0}</td>`;
        html += `<td class="bg-info">${item.kenneth_inventory || 0}</td>`;
        html += `<td><input type="number" class="form-control recount-count" data-record-id="${item.id}" step="0.01"></td>`;
        html += `<td><textarea class="form-control recount-remarks" data-record-id="${item.id}" rows="2" placeholder="e.g., 9 were damaged, incomplete parts"></textarea></td>`;
        html += `</tr>`;
    });
    
    html += '</tbody></table></div>';
    $('#recountItems').html(html);
    $('#recountModal').modal('show');
    
    $('#saveRecount').off('click').on('click', function() {
        let recounts = [];
        $('.recount-count').each(function() {
            let recordId = $(this).data('record-id');
            let recountCount = $(this).val();
            let remarks = $(`.recount-remarks[data-record-id="${recordId}"]`).val();
            if (recountCount) {
                recounts.push({
                    record_id: recordId,
                    recount_count: recountCount,
                    remarks: remarks || ''
                });
            }
        });
        
        if (recounts.length === 0) {
            alert('No recount counts entered');
            return;
        }
        
        $.ajax({
            url: '/save_recount',
            method: 'POST',
            contentType: 'application/json',
            data: JSON.stringify({recounts: recounts}),
            success: function(data) {
                if (data.success) {
                    alert('Recounts saved successfully!');
                    $('#recountModal').modal('hide');
                    location.reload();
                }
            },
            error: function() {
                alert('Error saving recounts');
            }
        });
    });
}

function completeCounting() {
    if (!currentSessionId) {
        alert('Please save counts first');
        return;
    }
    
    if (confirm('Are you sure you want to complete this counting session?')) {
        $.ajax({
            url: '/complete_counting',
            method: 'POST',
            contentType: 'application/json',
            data: JSON.stringify({session_id: currentSessionId}),
            success: function(data) {
                if (data.success) {
                    alert('Counting session completed!');
                    window.location.href = '/dashboard';
                }
            },
            error: function() {
                alert('Error completing session');
            }
        });
    }
}

function highlightSku(skuId) {
    $('html, body').animate({
        scrollTop: $(`#sku-row-${skuId}`).offset().top - 100
    }, 500);
    $(`#sku-row-${skuId}`).css('background-color', '#ffff99');
    setTimeout(() => {
        $(`#sku-row-${skuId}`).css('background-color', '');
    }, 3000);
}
</script>
{% endblock %}
