{% extends "base.html" %}

{% block content %}
<h2>Inventory Counting</h2>

<div class="card mb-3">
    <div class="card-body">
        <div class="row">
            <div class="col-md-3">
                <label>Select Warehouse (for tracking only)</label>
                <select id="warehouse" class="form-control">
                    <option value="Main Warehouse">Main Warehouse</option>
                    <option value="5th Floor Warehouse">5th Floor Warehouse</option>
                </select>
            </div>
            <div class="col-md-3">
                <label>Day Category</label>
                <select id="dayCategory" class="form-control">
                    <option value="All">-- All Day Categories --</option>
                    {% for cat in day_categories %}
                    <option value="{{ cat }}">{{ cat }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="col-md-3">
                <label>Item Category</label>
                <select id="itemCategory" class="form-control">
                    <option value="All">-- All Item Categories --</option>
                    {% for cat in item_categories %}
                    <option value="{{ cat }}">{{ cat }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="col-md-3">
                <label>Search SKU</label>
                <input type="text" id="searchSku" class="form-control" placeholder="Type to search...">
            </div>
        </div>
        <div class="row mt-2">
            <div class="col-md-12">
                <button id="loadAllBtn" class="btn btn-info">Load All SKUs</button>
                <button id="applyFilters" class="btn btn-primary">Apply Filters</button>
                <button id="saveCounts" class="btn btn-success">Save All Counts</button>
                <button id="completeCounting" class="btn btn-danger">Complete Counting Session</button>
            </div>
        </div>
    </div>
</div>

<div id="loadingIndicator" style="display: none; text-align: center; padding: 20px;">
    <div class="spinner-border text-primary" role="status">
        <span class="visually-hidden">Loading...</span>
    </div>
    <p>Loading SKUs...</p>
</div>

<div id="skusList" class="row">
    <div class="col-12">
        <div class="alert alert-info text-center">
            Click "Load All SKUs" to see all products, or use filters to narrow down.
        </div>
    </div>
</div>

<div id="recountModal" class="modal fade" tabindex="-1">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Recount Required Items</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <div id="recountItems"></div>
                <button id="saveRecount" class="btn btn-primary mt-3">Save Recounts</button>
            </div>
        </div>
    </div>
</div>

<script>
let currentSessionId = null;
let currentSkus = [];

$(document).ready(function() {
    console.log("Page loaded");
    
    // Load All SKUs button
    $('#loadAllBtn').click(function() {
        loadSkus('All', 'All', '');
    });
    
    // Apply filters button
    $('#applyFilters').click(function() {
        let dayCategory = $('#dayCategory').val();
        let itemCategory = $('#itemCategory').val();
        let search = $('#searchSku').val();
        loadSkus(dayCategory, itemCategory, search);
    });
    
    // Save counts button
    $('#saveCounts').click(function() {
        saveAllCounts();
    });
    
    // Complete counting button
    $('#completeCounting').click(function() {
        completeCounting();
    });
    
    // Search on enter key
    $('#searchSku').on('keypress', function(e) {
        if (e.which === 13) {
            let dayCategory = $('#dayCategory').val();
            let itemCategory = $('#itemCategory').val();
            let search = $(this).val();
            loadSkus(dayCategory, itemCategory, search);
        }
    });
});

function loadSkus(dayCategory, itemCategory, search) {
    $('#loadingIndicator').show();
    $('#skusList').html('<div class="col-12"><div class="alert alert-info text-center">Loading...</div></div>');
    
    console.log("Loading with:", {dayCategory, itemCategory, search});
    
    $.get('/get_skus', {
        day_category: dayCategory,
        item_category: itemCategory,
        search: search
    })
    .done(function(data) {
        console.log("Received:", data.length, "SKUs");
        currentSkus = data;
        displaySkus(data);
    })
    .fail(function(xhr) {
        console.error("Error:", xhr.status, xhr.statusText);
        $('#skusList').html('<div class="col-12"><div class="alert alert-danger text-center">Error: ' + xhr.statusText + '</div></div>');
    })
    .always(function() {
        $('#loadingIndicator').hide();
    });
}

function displaySkus(skus) {
    if (!skus || skus.length === 0) {
        $('#skusList').html('<div class="col-12"><div class="alert alert-warning text-center">No SKUs found. Try different filters or click "Load All SKUs".</div></div>');
        return;
    }
    
    let html = '<div class="col-12"><div class="table-responsive"><table class="table table-bordered table-hover table-striped">';
    html += '<thead class="table-dark">';
    html += '<tr>';
    html += '<th>SKU</th>';
    html += '<th>Description (Item Category)</th>';
    html += '<th>Day Category</th>';
    html += '<th>Last Count</th>';
    html += '<th>Container Qty</th>';
    html += '<th>Final Expected</th>';
    html += '<th>Kenneth\'s Inv</th>';
    html += '<th>Initial Count</th>';
    html += '<th>Status</th>';
    html += '</tr>';
    html += '</thead><tbody>';
    
    skus.forEach(function(sku) {
        let statusBadge = '';
        if (sku.bypass_recount) {
            statusBadge = '<span class="badge bg-warning">Bypass</span>';
        }
        
        html += `<tr id="sku-row-${sku.id}">`;
        html += `<td><strong>${sku.sku}</strong></td>`;
        html += `<td>${sku.description || '-'}</td>`;
        html += `<td>${sku.category || '-'}</td>`;
        html += `<td class="fw-bold">${sku.last_count || 0}</td>`;
        html += `<td>${sku.total_container_qty || 0}</td>`;
        html += `<td class="fw-bold text-primary">${sku.final_expected_count || 0}</td>`;
        html += `<td class="fw-bold text-success">${sku.kenneth_inventory || 0}</td>`;
        html += `<td><input type="number" class="form-control initial-count" data-sku-id="${sku.id}" value="0" step="0.01" style="min-width: 100px; width: 100px;"></td>`;
        html += `<td>${statusBadge}</td>`;
        html += `</tr>`;
    });
    
    html += '</tbody></table></div></div>';
    $('#skusList').html(html);
}

function saveAllCounts() {
    let warehouse = $('#warehouse').val();
    let counts = {};
    
    $('.initial-count').each(function() {
        let skuId = $(this).data('sku-id');
        let count = $(this).val();
        if (count && parseFloat(count) !== 0) {
            counts[skuId] = {initial_count: count};
        }
    });
    
    let totalCounted = Object.keys(counts).length;
    
    if (!confirm(`Save counts for ${totalCounted} SKUs to ${warehouse}?`)) {
        return;
    }
    
    $('#saveCounts').prop('disabled', true).text('Saving...');
    
    $.ajax({
        url: '/counting',
        method: 'POST',
        contentType: 'application/json',
        data: JSON.stringify({
            session_id: currentSessionId,
            warehouse: warehouse,
            counts: counts
        }),
        success: function(data) {
            if (data.success) {
                currentSessionId = data.session_id;
                alert('Counts saved successfully!');
                checkForRecounts();
            } else {
                alert('Error saving counts');
            }
        },
        error: function(xhr) {
            alert('Error: ' + xhr.statusText);
        },
        complete: function() {
            $('#saveCounts').prop('disabled', false).text('Save All Counts');
        }
    });
}

function checkForRecounts() {
    if (!currentSessionId) return;
    
    $.get('/get_recount_list', {session_id: currentSessionId}, function(data) {
        if (data.length > 0) {
            showRecountModal(data);
        } else {
            alert('No items need recount. You can complete the counting session.');
        }
    });
}

function showRecountModal(recountItems) {
    let html = '<div class="table-responsive"><table class="table table-bordered">';
    html += '<thead><tr>';
    html += '<th>SKU</th>';
    html += '<th>Initial Count</th>';
    html += '<th>Final Expected</th>';
    html += '<th>Kenneth\'s Inv</th>';
    html += '<th>Recount Count</th>';
    html += '<th>Remarks</th>';
    html += '</tr></thead><tbody>';
    
    recountItems.forEach(function(item) {
        html += `<tr>`;
        html += `<td>${item.sku}</td>`;
        html += `<td class="bg-warning">${item.initial_count}</td>`;
        html += `<td class="bg-info">${item.final_expected_count || 0}</td>`;
        html += `<td class="bg-info">${item.kenneth_inventory || 0}</td>`;
        html += `<td><input type="number" class="form-control recount-count" data-record-id="${item.id}" step="0.01"></td>`;
        html += `<td><textarea class="form-control recount-remarks" data-record-id="${item.id}" rows="2" placeholder="Reason for discrepancy"></textarea></td>`;
        html += `</tr>`;
    });
    
    html += '</tbody></table></div>';
    $('#recountItems').html(html);
    $('#recountModal').modal('show');
    
    $('#saveRecount').off('click').on('click', function() {
        let recounts = [];
        $('.recount-count').each(function() {
            let recordId = $(this).data('record-id');
            let recountCount = $(this).val();
            let remarks = $(`.recount-remarks[data-record-id="${recordId}"]`).val();
            if (recountCount) {
                recounts.push({
                    record_id: recordId,
                    recount_count: recountCount,
                    remarks: remarks || ''
                });
            }
        });
        
        if (recounts.length === 0) {
            alert('No recount counts entered');
            return;
        }
        
        $.ajax({
            url: '/save_recount',
            method: 'POST',
            contentType: 'application/json',
            data: JSON.stringify({recounts: recounts}),
            success: function(data) {
                if (data.success) {
                    alert('Recounts saved!');
                    $('#recountModal').modal('hide');
                    location.reload();
                }
            }
        });
    });
}

function completeCounting() {
    if (!currentSessionId) {
        alert('Please save counts first');
        return;
    }
    
    if (confirm('Complete this counting session?')) {
        $.ajax({
            url: '/complete_counting',
            method: 'POST',
            contentType: 'application/json',
            data: JSON.stringify({session_id: currentSessionId}),
            success: function(data) {
                if (data.success) {
                    alert('Session completed!');
                    window.location.href = '/dashboard';
                }
            }
        });
    }
}
</script>
{% endblock %}
