{% extends "base.html" %}

{% block content %}
<h2>Audit Dashboard</h2>

<div class="card">
    <div class="card-header">
        <h5>Export Count Data for Review</h5>
    </div>
    <div class="card-body">
        <div class="alert alert-info">
            <i class="bi bi-info-circle"></i> As an audit user, you can only view and export data. You cannot modify counts or user roles.
        </div>

        <form action="{{ url_for('export_counts') }}" method="POST">
            <div class="mb-3">
                <label>Select Date to Export</label>
                <input type="date" name="filter_date" class="form-control" required>
                <small class="text-muted">Export all counting sessions from this date</small>
            </div>
            <button type="submit" class="btn btn-primary">Export to Excel</button>
        </form>
    </div>
</div>

<div class="card mt-3">
    <div class="card-header">
        <h5>Recent Audit Logs</h5>
    </div>
    <div class="card-body">
        <div class="table-responsive">
            <table class="table table-bordered table-sm" id="auditTable">
                <thead>
                    <tr>
                        <th>Timestamp</th>
                        <th>User</th>
                        <th>Action</th>
                        <th>Details</th>
                    </tr>
                </thead>
                <tbody>
                    <!-- Audit logs will be loaded via AJAX -->
                </tbody>
            </table>
        </div>
    </div>
</div>

<script>
$(document).ready(function() {
    loadAuditLogs();

    function loadAuditLogs() {
        $.get('/get_audit_logs', function(data) {
            let html = '';
            data.forEach(function(log) {
                html += `<tr>
                    <td>${log.timestamp}</td>
                    <td>${log.user}</td>
                    <td>${log.action}</td>
                    <td>${log.details}</td>
                </tr>`;
            });
            $('#auditTable tbody').html(html);
        });
    }
});
</script>
{% endblock %}
